<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.webmanifest">
<title>Canasta Score Book</title>
<style>
/* Built for a partially sighted reader on a phone at a table: large type,
   high contrast, and tap targets that do not need aiming. Nothing here is
   decorative at the cost of legibility. */
:root {
  --scale: 1;
  --bg: #f4f1ea;      /* paper, not white — less glare under a room light */
  --ink: #14181c;
  --dim: #4a5560;
  --line: #c9c2b4;
  --card: #fffdf8;
  --felt: #14532d;
  --felt-ink: #ffffff;
  --accent: #8c2f18;
  --ok: #14532d;
  --shadow: 0 1px 3px rgba(0,0,0,.16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181c; --ink: #f2efe8; --dim: #a9b4bf; --line: #39434d;
    --card: #1e242b; --felt: #0f3d22; --felt-ink: #ffffff;
    --accent: #ff9c7a; --ok: #7bd39a; --shadow: 0 1px 3px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: calc(19px * var(--scale));
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 680px; margin: 0 auto; padding: 0 .7rem 4rem; }

header {
  background: var(--felt); color: var(--felt-ink);
  padding: .55rem .8rem; display: flex; align-items: center; gap: .5rem;
  position: sticky; top: 0; z-index: 5;
}
header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; letter-spacing: .01em; flex: 1; }
.txtsize { display: flex; gap: .3rem; }

button {
  font: inherit; color: inherit; cursor: pointer;
  border: 2px solid var(--line); background: var(--card);
  border-radius: .5rem; padding: .55rem .8rem; min-height: 2.9rem;
  box-shadow: var(--shadow);
}
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--felt); color: var(--felt-ink); border-color: var(--felt); font-weight: 600; }
button.ghost { background: transparent; box-shadow: none; }
button.tiny { min-height: 2.2rem; padding: .25rem .6rem; font-size: .9rem; }
header button { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.5); color: var(--felt-ink); box-shadow: none; }

input[type=text], input[type=number] {
  font: inherit; color: var(--ink); background: var(--card);
  border: 2px solid var(--line); border-radius: .5rem;
  padding: .55rem .6rem; min-height: 2.9rem; width: 100%;
}
input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
label { display: block; font-size: .92rem; color: var(--dim); margin: .1rem 0 .25rem; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: .7rem;
         padding: .8rem; margin: .8rem 0; box-shadow: var(--shadow); }
.panel h2 { margin: 0 0 .5rem; font-size: 1rem; color: var(--dim); font-weight: 600;
            text-transform: uppercase; letter-spacing: .06em; }

/* Scoreboard */
.board { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.team { background: var(--card); border: 2px solid var(--line); border-radius: .7rem;
        padding: .7rem .5rem; text-align: center; box-shadow: var(--shadow); }
.team.lead { border-color: var(--ok); }
.team .who { font-size: 1.05rem; font-weight: 600; word-break: break-word; }
.team .total { font-size: calc(2.9rem * 1); font-weight: 700; line-height: 1.05; margin: .1rem 0;
               font-variant-numeric: tabular-nums; }
.team .open { font-size: .95rem; color: var(--dim); }
.team .open b { color: var(--ink); font-size: 1.15rem; }

.deal { text-align: center; padding: .7rem; }
.deal .lbl { color: var(--dim); font-size: .95rem; }
.deal .who { font-size: 2rem; font-weight: 700; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: .5rem .35rem; text-align: right; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-size: .85rem; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
tbody tr { cursor: pointer; }
tbody tr:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
td.run { color: var(--dim); font-size: .9rem; }
td.win { color: var(--ok); font-weight: 700; }
td.win .run { color: var(--ok); font-weight: 400; }
.note { color: var(--dim); font-size: .9rem; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chips button[aria-pressed="true"] { background: var(--felt); color: var(--felt-ink); border-color: var(--felt); font-weight: 600; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.stack > * + * { margin-top: .7rem; }
.won { background: var(--felt); color: var(--felt-ink); border-radius: .7rem; padding: .8rem;
       text-align: center; font-size: 1.25rem; font-weight: 600; margin: .8rem 0; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .9rem; }
.actions button { flex: 1 1 auto; }
dialog { border: none; border-radius: .8rem; padding: 0; background: var(--bg); color: var(--ink);
         width: min(96vw, 620px); box-shadow: 0 8px 40px rgba(0,0,0,.45); }
dialog::backdrop { background: rgba(0,0,0,.55); }
.sheet { padding: .9rem; }
.sheet h2 { margin: 0 0 .2rem; font-size: 1.3rem; }
.err { color: var(--accent); font-weight: 600; }

/* The connecting indicator. A slow, large pulse rather than a small fast
   spinner: it has to read at a glance to a partially sighted player, and a
   fast flicker is both harder to see and unpleasant. Motion is dropped
   entirely for anyone who has asked the system for less of it. */
.loading { display: flex; gap: .55rem; justify-content: center; padding: .5rem 0 .2rem; }
.loading i { width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--ok);
             opacity: .25; animation: pulse 1.4s ease-in-out infinite; }
.loading i:nth-child(2) { animation-delay: .2s; }
.loading i:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); }
                   40% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .loading i { animation: none; opacity: .7; }
}
.seat { display: grid; grid-template-columns: 5.5rem 1fr; gap: .5rem; align-items: center; }
.seat span { color: var(--dim); font-size: .92rem; }
</style>
</head>
<body>
<header>
  <h1>Canasta Score Book</h1>
  <div class="txtsize">
    <button class="tiny" id="smaller" aria-label="Smaller text">A&minus;</button>
    <button class="tiny" id="bigger" aria-label="Larger text">A+</button>
  </div>
</header>
<div class="wrap"><main id="app"></main></div>

<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>

<script src="firebase-config.js"></script>
<script type="module">
"use strict";

/* ------------------------------------------------------------------ rules
   The opening minimum a side must meet, chosen by its score when the hand is
   dealt. These MUST agree with canasta::Rules and openRequirementFor() in
   src/canasta/canastaengine.{h,cpp} — scripts/scorepad-check.py reads the
   numbers out of both files and fails the build if they drift apart. Do not
   restate them anywhere else in this file. */
const OPENING_BANDS = [
  { below: 0,    need: 15  },
  { below: 1500, need: 50  },
  { below: 3000, need: 90  },
  { below: null, need: 120 }
];
const DEFAULT_TARGET = 5000;
const DEFAULT_OUT_BONUS = 100;
/* The house cut bonus: the pack is cut for the dealer, and if the deal uses it
   up exactly — no cards left over — the side that cut scores this. Not a rule
   the desktop game knows, so there is nothing for it to drift against. */
const EXACT_CUT_BONUS = 50;

function openingFor(score) {
  for (const b of OPENING_BANDS) if (b.below === null || score < b.below) return b.need;
  return OPENING_BANDS[OPENING_BANDS.length - 1].need;
}

/* ------------------------------------------------------------------ state */
const KEY = "canasta-scorebook-v1";
const blank = () => ({
  players: ["", "", "", ""],   // clockwise around the table
  firstDealer: 0,
  target: DEFAULT_TARGET,
  hands: [],
  started: false,
  history: []      // games already finished, oldest first
});
let S = blank();
let scale = 1;

/* --------------------------------------------------------------- sharing
   One book, four phones. The scorer's phone writes it; the others read it and
   show it. Everything below degrades to nothing: with no databaseURL, or no
   signal, or the SDK unreachable, the book still works on this phone alone —
   sharing is reported as unavailable rather than breaking the evening. */
const SDK = "https://www.gstatic.com/firebasejs/12.18.0/";
const CODE_LETTERS = "BCDFGHJKMNPQRSTVWXYZ";  // no vowels, and nothing that reads as 0/1
let room = null;        // { code, scorer }
let fb = null, db = null, unlisten = null;
let sync = "off";       // off | unavailable | connecting | live | error
let gotBook = false;    // has the scorer's book actually arrived yet
let scorerHere = "";    // who the shared book says is keeping score

let deviceId = "";
function myId() {
  if (deviceId) return deviceId;
  try {
    deviceId = localStorage.getItem(KEY + "-device") || "";
    if (!deviceId) {
      deviceId = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(KEY + "-device", deviceId);
    }
  } catch (e) { deviceId = "this-device"; }
  return deviceId;
}
const newCode = () => Array.from({ length: 4 },
  () => CODE_LETTERS[Math.floor(Math.random() * CODE_LETTERS.length)]).join("");


function saveLocal() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) { /* private mode, blocked storage — the book still works */ }
}
function save() {
  pushBook();
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    localStorage.setItem(KEY + "-scale", String(scale));
    localStorage.setItem(KEY + "-room", room ? JSON.stringify(room) : "");
  } catch (e) { /* private mode, blocked storage — the game still works */ }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const v = JSON.parse(raw); if (v && Array.isArray(v.players)) S = Object.assign(blank(), v); }
    const sc = parseFloat(localStorage.getItem(KEY + "-scale"));
    if (sc >= 0.8 && sc <= 2.2) scale = sc;
    const r = localStorage.getItem(KEY + "-room");
    if (r) { const v = JSON.parse(r); if (v && v.code) room = v; }
  } catch (e) { /* fall back to a fresh book */ }
}

/* Firebase is loaded only if there is a database to talk to, and a failure
   here is never fatal — it downgrades to one book on one phone. */
async function connect() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.databaseURL) { sync = "unavailable"; return false; }
  if (db) return true;
  sync = "connecting";
  try {
    const [appMod, dbMod] = await Promise.all([
      import(SDK + "firebase-app.js"),
      import(SDK + "firebase-database.js")
    ]);
    db = dbMod.getDatabase(appMod.initializeApp(cfg));
    fb = dbMod;
    return true;
  } catch (e) { sync = "error"; db = null; fb = null; return false; }
}

/* Firebase drops nulls and stores an empty list as nothing at all, so what
   comes back is not shaped quite like what went in. Put it back together
   rather than letting undefined leak into the arithmetic. */
function sanitise(book) {
  const b = Object.assign(blank(), book || {});
  b.players = [0, 1, 2, 3].map((i) => (b.players && b.players[i]) || "");
  b.hands = (b.hands || []).filter(Boolean).map((h) => ({
    a: Number(h.a || 0), b: Number(h.b || 0),
    outSeat: (h.outSeat === undefined || h.outSeat === null) ? null : Number(h.outSeat),
    outBonus: Number(h.outBonus || 0),
    cutTeam: (h.cutTeam === undefined || h.cutTeam === null) ? null : Number(h.cutTeam)
  }));
  b.firstDealer = Number(b.firstDealer || 0);
  b.target = Number(b.target || DEFAULT_TARGET);
  b.started = !!b.started;
  b.history = (b.history || []).filter(Boolean).map((g) => ({
    finishedAt: Number(g.finishedAt || 0),
    players: [0, 1, 2, 3].map((i) => (g.players && g.players[i]) || "?"),
    target: Number(g.target || DEFAULT_TARGET),
    hands: (g.hands || []).filter(Boolean).map((h) => ({
      a: Number(h.a || 0), b: Number(h.b || 0),
      outSeat: (h.outSeat === undefined || h.outSeat === null) ? null : Number(h.outSeat),
      outBonus: Number(h.outBonus || 0),
      cutTeam: (h.cutTeam === undefined || h.cutTeam === null) ? null : Number(h.cutTeam)
    }))
  }));
  return b;
}

function listen() {
  if (!db || !room) return;
  if (unlisten) { unlisten(); unlisten = null; }
  unlisten = fb.onValue(fb.ref(db, "rooms/" + room.code), (snap) => {
    const v = snap.val();
    sync = "live";
    if (!v) { if (room.scorer) pushBook(); else render(); return; }
    scorerHere = v.scorerName || "";
    // The scorer is the source of truth; it must never be overwritten by the
    // echo of its own write, which would fight whatever is being typed.
    if (!room.scorer) { S = sanitise(v.book); gotBook = true; saveLocal(); }
    render();
  }, () => { sync = "error"; render(); });
}

let pushTimer = 0;
function pushBook() {
  if (!db || !room || !room.scorer) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    fb.set(fb.ref(db, "rooms/" + room.code), {
      book: S, scorerId: myId(),
      scorerName: nameOf(0) === "?" ? "" : S.players.join(""),
      updatedAt: Date.now()
    }).then(() => { sync = "live"; }).catch(() => { sync = "error"; render(); });
  }, 250);
}

async function startSharing() {
  sync = "connecting"; render();       // paint the indicator before we go away to connect
  if (!(await connect())) { render(); return; }
  room = { code: newCode(), scorer: true };
  save(); listen(); pushBook(); render();
}
async function joinRoom(code) {
  sync = "connecting"; render();
  if (!(await connect())) { render(); return; }
  room = { code: String(code).toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4), scorer: false };
  if (room.code.length < 4) { room = null; return; }
  gotBook = false;
  S.started = true;   // a watcher never sets players up; the book arrives whole
  view = "game";
  save(); listen(); render();
}
function stopSharing() {
  if (unlisten) { unlisten(); unlisten = null; }
  room = null; sync = db ? "off" : sync; save(); render();
}
function takeOverScoring() {
  if (!room) return;
  room.scorer = true; save(); pushBook(); render();
}
const canEdit = () => !room || room.scorer;

/* Partners sit opposite, so seats 1 and 3 are one side and seats 2 and 4 the
   other. That is why the setup screen asks for the CLOCKWISE order and then
   shows you the two sides it worked out. */
const teamOfSeat = (i) => i % 2;
const seatsOf = (t) => [t, t + 2];
const nameOf = (i) => (S.players[i] || "?").trim() || "?";
const teamName = (t) => seatsOf(t).map(nameOf).join(" + ");
const dealerOf = (handIndex) => (S.firstDealer + handIndex) % 4;

function handPoints(h, t) {
  let v = t === 0 ? Number(h.a || 0) : Number(h.b || 0);
  if (h.outSeat !== null && h.outSeat !== undefined && teamOfSeat(h.outSeat) === t)
    v += Number(h.outBonus || 0);
  if (h.cutTeam === t) v += EXACT_CUT_BONUS;
  return v;
}
function totalsAfter(n) {
  const t = [0, 0];
  for (let i = 0; i < n && i < S.hands.length; i++) {
    t[0] += handPoints(S.hands[i], 0);
    t[1] += handPoints(S.hands[i], 1);
  }
  return t;
}
const totals = () => totalsAfter(S.hands.length);
function winner() {
  const t = totals();
  if (t[0] < S.target && t[1] < S.target) return null;
  if (t[0] === t[1]) return null;          // both over and level: play on
  return t[0] > t[1] ? 0 : 1;
}

/* ------------------------------------------------------------- the record
   Everything below is derived from the hands themselves rather than counted
   as the game goes, so a corrected hand corrects the record with it. Players
   are tracked by INITIAL and not by seat, because who partners whom changes
   week to week and it is the person's record that is interesting. */
function totalsOfGame(g) {
  const t = [0, 0];
  for (const h of g.hands) { t[0] += handPoints(h, 0); t[1] += handPoints(h, 1); }
  return t;
}
const sideOf = (g, t) => [g.players[t] || "?", g.players[t + 2] || "?"];
const sideName = (g, t) => sideOf(g, t).join(" + ");
function winnerOfGame(g) {
  const t = totalsOfGame(g);
  if (t[0] === t[1]) return null;
  return t[0] > t[1] ? 0 : 1;
}

function theRecord() {
  const who = {};   // initial -> tally
  const of = (n) => (who[n] = who[n] || { name: n, played: 0, won: 0, hands: 0, out: 0, cuts: 0, best: 0 });
  const records = { hand: null, margin: null, score: null, longest: null };

  for (const g of S.history) {
    const t = totalsOfGame(g);
    const w = winnerOfGame(g);
    for (let seat = 0; seat < 4; seat++) {
      const e = of(g.players[seat] || "?");
      e.played++;
      e.hands += g.hands.length;
      if (w !== null && teamOfSeat(seat) === w) e.won++;
      e.best = Math.max(e.best, t[teamOfSeat(seat)]);
    }
    for (const h of g.hands) {
      if (h.outSeat !== null && h.outSeat !== undefined) of(g.players[h.outSeat] || "?").out++;
      if (h.cutTeam !== null && h.cutTeam !== undefined)
        sideOf(g, h.cutTeam).forEach((n) => of(n).cuts++);
      for (const side of [0, 1]) {
        const v = handPoints(h, side);
        if (!records.hand || v > records.hand.value)
          records.hand = { value: v, who: sideName(g, side), when: g.finishedAt };
      }
    }
    if (w !== null) {
      const margin = Math.abs(t[0] - t[1]);
      if (!records.margin || margin > records.margin.value)
        records.margin = { value: margin, who: sideName(g, w), when: g.finishedAt };
    }
    const high = Math.max(t[0], t[1]);
    if (!records.score || high > records.score.value)
      records.score = { value: high, who: sideName(g, t[0] >= t[1] ? 0 : 1), when: g.finishedAt };
    if (!records.longest || g.hands.length > records.longest.value)
      records.longest = { value: g.hands.length, who: "", when: g.finishedAt };
  }

  const table = Object.values(who).sort((a, b) =>
    (b.won - a.won) || (b.played - a.played) || a.name.localeCompare(b.name));
  return { table, records };
}

function fileCurrentGame() {
  if (!S.hands.length) return false;
  S.history.push({
    finishedAt: Date.now(),
    players: S.players.slice(), target: S.target, hands: S.hands.slice()
  });
  S.hands = [];
  return true;
}

const niceDate = (ms) => {
  if (!ms) return "";
  try { return new Date(ms).toLocaleDateString(undefined, { day: "numeric", month: "short" }); }
  catch (e) { return ""; }
};

/* ------------------------------------------------------------------- view */
const app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let view = "game";   // game | dashboard

function render() {
  document.documentElement.style.setProperty("--scale", String(scale));
  if (room && !room.scorer && !gotBook && !S.started) {
    app.innerHTML = waitingView();
    const u = document.getElementById("unshare");
    if (u) u.onclick = stopSharing;
    return;
  }
  if (!S.started) { app.innerHTML = setupView(); wireSetup(); return; }
  if (view === "dashboard") { app.innerHTML = dashboardView(); wireDashboard(); return; }
  app.innerHTML = gameView();
  wireGame();
}

function setupView() {
  const seats = S.players.map((p, i) => `
    <div class="seat">
      <span>Seat ${i + 1}</span>
      <input type="text" id="p${i}" value="${esc(p)}" maxlength="4" autocomplete="off"
             autocapitalize="characters" placeholder="initial" aria-label="Seat ${i + 1} initial">
    </div>`).join("");
  return `
  <div class="panel stack">
    <h2>Who is playing</h2>
    <p class="note">Enter the four initials <b>in the order you sit, going clockwise</b>.
       Partners sit opposite each other, so the app works out the two sides from that.</p>
    ${seats}
    <div id="sides" class="note"></div>
  </div>
  <div class="panel stack">
    <h2>First deal</h2>
    <p class="note">Who deals the first hand? It moves round clockwise after that.</p>
    <div class="chips" id="dealerPick"></div>
  </div>
  <div class="panel stack">
    <h2>Game to</h2>
    <label for="target">Winning score</label>
    <input type="number" id="target" value="${S.target}" min="100" step="100" inputmode="numeric">
  </div>
  <div class="actions">
    <button class="primary" id="start">Start the game</button>
  </div>
  ${S.hands.length ? `<p class="note">This will keep the ${S.hands.length} hand(s) already recorded.</p>` : ""}
  <div class="panel stack">
    <h2>Or join the table</h2>
    <p class="note">If someone else is keeping score, you do not need any of the above &mdash;
       just type their four-letter code. Their book appears here and keeps itself up to date.</p>
    <div class="row">
      <input type="text" id="joincode2" maxlength="4" autocomplete="off"
             autocapitalize="characters" placeholder="CODE" aria-label="Game code">
      <button id="join2">Join</button>
    </div>
  </div>`;
}

function waitingView() {
  return `
    <div class="panel stack" style="text-align:center">
      <h2>Joining ${esc(room.code)}</h2>
      <div class="loading" aria-hidden="true"><i></i><i></i><i></i></div>
      <p style="font-size:1.3rem" role="status">Waiting for the score book&hellip;</p>
      <p class="note">This takes a few seconds the first time. It will fill in on its own
         as soon as the scorer's phone answers &mdash; there is nothing to press.</p>
      ${sync === "error" ? `<p class="err">Cannot reach the shared book. Check the signal.</p>` : ""}
    </div>
    <div class="actions"><button class="ghost" id="unshare">Stop and keep my own book</button></div>`;
}

function gameView() {
  const t = totals();
  const w = winner();
  const nextHand = S.hands.length;
  const rows = S.hands.map((h, i) => {
    const run = totalsAfter(i + 1);
    const bits = [];
    if (h.outSeat !== null && h.outSeat !== undefined) bits.push(nameOf(h.outSeat) + " out");
    if (h.cutTeam !== null && h.cutTeam !== undefined) bits.push("cut " + EXACT_CUT_BONUS);
    return `<tr tabindex="0" data-edit="${i}">
      <td>${i + 1}<div class="run">${esc(nameOf(dealerOf(i)))} dealt${bits.length ? " &middot; " + bits.map(esc).join(" &middot; ") : ""}</div></td>
      <td>${handPoints(h, 0)}<div class="run">${run[0]}</div></td>
      <td>${handPoints(h, 1)}<div class="run">${run[1]}</div></td>
    </tr>`;
  }).reverse().join("");

  return `
  ${w !== null ? `<div class="won">${esc(teamName(w))} win, ${t[w]} to ${t[1 - w]}</div>
     ${canEdit() ? `<div class="actions"><button class="primary" id="fileit">File this game and start the next</button></div>` : ""}` : ""}
  <div class="board">
    ${[0, 1].map((i) => `
      <div class="team ${t[i] > t[1 - i] ? "lead" : ""}">
        <div class="who">${esc(teamName(i))}</div>
        <div class="total">${t[i]}</div>
        <div class="open">opens on <b>${openingFor(t[i])}</b></div>
      </div>`).join("")}
  </div>

  <div class="panel deal">
    <div class="lbl">Hand ${nextHand + 1} &mdash; deals</div>
    <div class="who">${esc(nameOf(dealerOf(nextHand)))}</div>
    <div class="lbl">then ${esc(nameOf(dealerOf(nextHand + 1)))}</div>
  </div>

  ${canEdit() ? `<div class="actions">
    <button class="primary" id="record">Record hand ${nextHand + 1}</button>
  </div>` : `<div class="panel"><p class="note">${esc(scorerHere ? scorerHere : "Someone else")} is keeping score.
    This phone follows along and updates on its own.</p></div>`}

  <div class="panel">
    <h2>The book</h2>
    ${S.hands.length ? `<table>
      <thead><tr><th>Hand</th><th>${esc(teamName(0))}</th><th>${esc(teamName(1))}</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <p class="note">Small figures are the running total. Tap any hand to correct it.</p>`
      : `<p class="note">Nothing recorded yet.</p>`}
  </div>

  ${sharePanel()}

  <div class="actions">
    <button class="ghost" id="past">Past games${S.history.length ? " (" + S.history.length + ")" : ""}</button>
    ${canEdit() ? `<button class="ghost" id="players">Players &amp; settings</button>
    <button class="ghost" id="newgame">New game</button>` : ""}
  </div>`;
}

function dashboardView() {
  const { table, records } = theRecord();
  const rec = (label, r, suffix) => r
    ? `<tr><td>${label}</td><td>${r.value}${suffix || ""}</td><td class="run">${esc(r.who)}</td></tr>` : "";

  const games = S.history.slice().reverse().map((g, i) => {
    const t = totalsOfGame(g);
    const w = winnerOfGame(g);
    const n = S.history.length - i;
    // The SCORE is the prominent figure and the names sit under it, because
    // the sides change week to week and the number is what is being read.
    const cell = (side) => `<td class="${w === side ? "win" : ""}">${t[side]}${
      w === side ? " &check;" : ""}<div class="run">${esc(sideName(g, side))}</div></td>`;
    return `<tr tabindex="0" data-game="${S.history.length - 1 - i}">
      <td>${esc(niceDate(g.finishedAt)) || ("#" + n)}
          <div class="run">${g.hands.length} hands</div></td>
      ${cell(0)}${cell(1)}
    </tr>`;
  }).join("");

  return `
  <div class="panel">
    <h2>Players</h2>
    ${table.length ? `<table>
      <thead><tr><th>Who</th><th>Played</th><th>Won</th><th>Went out</th><th>Cuts</th></tr></thead>
      <tbody>${table.map((e) => `<tr>
        <td><b>${esc(e.name)}</b></td>
        <td>${e.played}</td>
        <td>${e.won}<div class="run">${e.played ? Math.round(100 * e.won / e.played) + "%" : ""}</div></td>
        <td>${e.out}</td>
        <td>${e.cuts}</td></tr>`).join("")}</tbody></table>
      <p class="note">Counted by initial rather than by seat, so a record follows the person
         even when the partnerships change. <b>Went out</b> is how many hands that person ended;
         <b>cuts</b> is exact cuts their side was on.</p>`
      : `<p class="note">Nothing here yet. Finish a game and it will be filed.</p>`}
  </div>

  ${records.hand ? `<div class="panel">
    <h2>Records</h2>
    <table><tbody>
      ${rec("Best hand", records.hand)}
      ${rec("Best game", records.score)}
      ${rec("Biggest win by", records.margin)}
      ${rec("Longest game", records.longest, " hands")}
    </tbody></table>
  </div>` : ""}

  <div class="panel">
    <h2>Games</h2>
    ${S.history.length ? `<table>
      <thead><tr><th>When</th><th colspan="2">Final scores</th></tr></thead>
      <tbody>${games}</tbody></table>
      <p class="note">Tap a game to put it back as the game in play, if it was filed by mistake.</p>`
      : `<p class="note">No games filed yet.</p>`}
  </div>

  <div class="actions">
    <button class="primary" id="backtogame">Back to the game</button>
    ${canEdit() ? `<button class="ghost" id="startnew">Start a new game</button>` : ""}
  </div>`;
}

function sharePanel() {
  const state = {
    off: "", unavailable: "Sharing is not set up on this copy.",
    connecting: "Connecting&hellip;", live: "In step with the table.",
    error: "Cannot reach the shared book right now — this phone is keeping its own."
  }[sync] || "";

  if (sync === "unavailable")
    return `<div class="panel"><h2>The table</h2>
      <p class="note">${state} The book is kept on this phone alone, which works
      perfectly well — it just will not appear on anyone else's.</p></div>`;

  if (sync === "connecting")
    return `<div class="panel stack" style="text-align:center"><h2>The table</h2>
      <div class="loading" aria-hidden="true"><i></i><i></i><i></i></div>
      <p role="status">Connecting&hellip;</p></div>`;

  if (!room)
    return `<div class="panel stack"><h2>The table</h2>
      <p class="note">Put the same book on everyone's phone. One person keeps score;
         the rest follow along.</p>
      <div class="actions">
        <button class="primary" id="share">Share with the table</button>
      </div>
      <label for="joincode">or join a game already going</label>
      <div class="row">
        <input type="text" id="joincode" maxlength="4" autocomplete="off"
               autocapitalize="characters" placeholder="CODE" aria-label="Game code">
        <button id="join">Join</button>
      </div></div>`;

  return `<div class="panel stack"><h2>The table</h2>
    <p style="font-size:2rem;font-weight:700;letter-spacing:.2em;margin:.1rem 0">${esc(room.code)}</p>
    <p class="note">${room.scorer
      ? "You are keeping score. The others open the book and join with this code."
      : "Following " + esc(room.code) + "."} ${state}</p>
    <div class="actions">
      ${room.scorer ? "" : `<button id="takeover">Take over scoring</button>`}
      <button class="ghost" id="unshare">Stop sharing</button>
    </div></div>`;
}

/* ------------------------------------------------------------------ wiring */
function wireSetup() {
  const sides = document.getElementById("sides");
  const pick = document.getElementById("dealerPick");
  const readNames = () => { for (let i = 0; i < 4; i++) S.players[i] = document.getElementById("p" + i).value.toUpperCase(); };
  const paint = () => {
    sides.innerHTML = `Sides: <b>${esc(teamName(0))}</b> against <b>${esc(teamName(1))}</b>`;
    pick.innerHTML = S.players.map((p, i) =>
      `<button data-seat="${i}" aria-pressed="${S.firstDealer === i}">${esc(nameOf(i))}</button>`).join("");
    pick.querySelectorAll("button").forEach((b) => b.onclick = () => {
      S.firstDealer = Number(b.dataset.seat); paint(); save();
    });
  };
  for (let i = 0; i < 4; i++)
    document.getElementById("p" + i).addEventListener("input", () => { readNames(); paint(); save(); });
  paint();

  const j = document.getElementById("join2");
  if (j) j.onclick = () => joinRoom(document.getElementById("joincode2").value);
  document.getElementById("start").onclick = () => {
    readNames();
    S.target = Math.max(100, Number(document.getElementById("target").value) || DEFAULT_TARGET);
    S.started = true; save(); render();
  };
}

function wireGame() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("share", startSharing);
  on("join", () => joinRoom(document.getElementById("joincode").value));
  on("unshare", stopSharing);
  on("takeover", takeOverScoring);
  on("past", () => { view = "dashboard"; render(); });
  if (!canEdit()) return;   // a watcher's phone shows the book and changes nothing

  on("record", () => openHand(null));
  on("players", () => { S.started = false; render(); });
  on("fileit", startNewGame);
  on("newgame", startNewGame);
  app.querySelectorAll("tr[data-edit]").forEach((tr) => {
    const go = () => openHand(Number(tr.dataset.edit));
    tr.onclick = go;
    tr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });
}

function startNewGame() {
  if (S.hands.length && !confirm(
      "File this game and start a new one? It is kept under Past games, and the "
      + "players stay as they are.")) return;
  fileCurrentGame();
  view = "game";
  save(); render();
}

function wireDashboard() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("backtogame", () => { view = "game"; render(); });
  on("startnew", () => { view = "game"; startNewGame(); });
  if (!canEdit()) return;
  app.querySelectorAll("tr[data-game]").forEach((tr) => {
    const go = () => {
      const i = Number(tr.dataset.game);
      const g = S.history[i];
      if (!g) return;
      if (S.hands.length && !confirm(
          "There is a game in play. File that one first and put this one back?")) return;
      fileCurrentGame();
      S.hands = g.hands.slice();
      S.players = g.players.slice();
      S.target = g.target;
      S.history = S.history.filter((x) => x !== g);
      view = "game";
      save(); render();
    };
    tr.onclick = go;
    tr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });
}

/* --------------------------------------------------------- the hand sheet */
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");

function openHand(index) {
  const editing = index !== null;
  const h = editing ? S.hands[index]
                    : { a: "", b: "", outSeat: null, outBonus: DEFAULT_OUT_BONUS, cutTeam: null };
  const n = editing ? index : S.hands.length;
  const draft = { a: h.a, b: h.b, outSeat: h.outSeat ?? null, outBonus: h.outBonus ?? DEFAULT_OUT_BONUS,
                  cutTeam: h.cutTeam ?? null };

  sheetBody.innerHTML = `
    <h2>Hand ${n + 1}</h2>
    <p class="note">${esc(nameOf(dealerOf(n)))} dealt.</p>
    <div class="stack">
      <div class="row">
        <div>
          <label for="sa">${esc(teamName(0))}</label>
          <input type="number" id="sa" inputmode="numeric" step="5" value="${draft.a}" placeholder="0">
        </div>
        <div>
          <label for="sb">${esc(teamName(1))}</label>
          <input type="number" id="sb" inputmode="numeric" step="5" value="${draft.b}" placeholder="0">
        </div>
      </div>
      <p class="note">The score each side made this hand, worked out as you do now.
         A minus is fine &mdash; type it with a minus sign.</p>

      <div>
        <label>Who went out</label>
        <div class="chips" id="outPick"></div>
      </div>
      <div id="outBonusWrap">
        <label for="ob">Going out bonus</label>
        <input type="number" id="ob" inputmode="numeric" step="50" value="${draft.outBonus}">
      </div>

      <div>
        <label>Exact cut &mdash; ${EXACT_CUT_BONUS} to the side that cut</label>
        <p class="note" style="margin:.1rem 0 .35rem">The deal used the cut up exactly, with no cards left over.</p>
        <div class="chips" id="cutPick"></div>
      </div>
      <p class="err" id="err"></p>
    </div>
    <div class="actions">
      <button class="primary" id="saveHand">${editing ? "Save changes" : "Save hand"}</button>
      <button class="ghost" id="cancelHand">Cancel</button>
      ${editing ? `<button class="ghost" id="delHand">Delete</button>` : ""}
    </div>`;

  const paintPicks = () => {
    document.getElementById("outPick").innerHTML =
      `<button data-out="none" aria-pressed="${draft.outSeat === null}">Nobody</button>` +
      S.players.map((p, i) => `<button data-out="${i}" aria-pressed="${draft.outSeat === i}">${esc(nameOf(i))}</button>`).join("");
    document.getElementById("cutPick").innerHTML =
      `<button data-cut="none" aria-pressed="${draft.cutTeam === null}">Nobody</button>` +
      [0, 1].map((t) => `<button data-cut="${t}" aria-pressed="${draft.cutTeam === t}">${esc(teamName(t))}</button>`).join("");
    document.getElementById("outBonusWrap").style.display = draft.outSeat === null ? "none" : "";
    document.getElementById("outPick").querySelectorAll("button").forEach((b) => b.onclick = () => {
      draft.outSeat = b.dataset.out === "none" ? null : Number(b.dataset.out); paintPicks();
    });
    document.getElementById("cutPick").querySelectorAll("button").forEach((b) => b.onclick = () => {
      draft.cutTeam = b.dataset.cut === "none" ? null : Number(b.dataset.cut); paintPicks();
    });
  };
  paintPicks();

  document.getElementById("cancelHand").onclick = () => sheet.close();
  if (editing) document.getElementById("delHand").onclick = () => {
    if (!confirm("Delete hand " + (n + 1) + "?")) return;
    S.hands.splice(index, 1); save(); sheet.close(); render();
  };
  document.getElementById("saveHand").onclick = () => {
    const a = document.getElementById("sa").value.trim();
    const b = document.getElementById("sb").value.trim();
    if (a === "" && b === "") {
      document.getElementById("err").textContent = "Put a score against at least one side.";
      return;
    }
    const rec = {
      a: Number(a || 0), b: Number(b || 0),
      outSeat: draft.outSeat,
      outBonus: draft.outSeat === null ? 0 : Number(document.getElementById("ob").value || 0),
      cutTeam: draft.cutTeam
    };
    if (editing) S.hands[index] = rec; else S.hands.push(rec);
    save(); sheet.close(); render();
  };

  sheet.showModal();
  document.getElementById("sa").focus();
}

/* ------------------------------------------------------------------- boot */
document.getElementById("bigger").onclick = () => { scale = Math.min(2.2, scale + 0.15); save(); render(); };
document.getElementById("smaller").onclick = () => { scale = Math.max(0.8, scale - 0.15); save(); render(); };
load();
render();
if (room) connect().then((ok) => { if (ok) listen(); render(); });
else if (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.databaseURL) { /* offered, not yet joined */ }
else { sync = "unavailable"; render(); }
if ("serviceWorker" in navigator)
  navigator.serviceWorker.register("sw.js").catch(() => { /* offline is a bonus, not a requirement */ });
</script>
</body>
</html>
