---
name: CI

# Fourteen games that only ever built on one openSUSE machine. This runs the
# same two test binaries on Linux and on Windows for every change, so a
# platform break is found by the machine rather than at release time.
# Contract: docs/specs/GHUB-0025-downloadable-builds.md

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Not ubuntu-22.04: GitHub begins deprecating that image on
          # 2026-09-17. Not windows-latest: it moved to Visual Studio 2026 in
          # June 2026, and Qt's prebuilt win64_msvc2022_64 wants VS 2022.
          - name: Linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Qt from apt is 6.4 on ubuntu-24.04, below this project's
      # find_package(Qt6 6.5 REQUIRED) floor, so both legs take the same
      # prebuilt Qt instead.
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          cache: true

      # The Qt that lands here links these and finds nothing bundled beside
      # it. ninja-build is not guaranteed on the image either.
      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgl1-mesa-dev \
            libxkbcommon-x11-0 libxcb-cursor0

      # Was ilammy/msvc-dev-cmd until GHUB-0031; the script carries the
      # reasoning and is shared with release.yml so the two cannot drift.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-msvc.ps1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # CMakeLists already sets QT_QPA_PLATFORM=offscreen for the UI test, so
      # both binaries run headless on both runners with nothing set here.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # GHUB-0052. restoreState() is the app's whole untrusted input surface, and
  # every bound in those parsers is invisible to an ordinary build: an
  # out-of-bounds read that lands in owned memory returns a wrong answer
  # quietly and the fuzzer scores it a pass. This leg is the one that can see
  # them, and it earned its place immediately — it found a signed overflow in
  # Canasta's pack-wholeness check that the ordinary build had just passed.
  #
  # Its own job rather than a step on the matrix: MSVC ships no UBSan, so this
  # is Linux only, and a sanitized binary is far too slow to run the whole
  # suite through.
  sanitizers:
    name: Saved-game fuzz (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgl1-mesa-dev \
            libxkbcommon-x11-0 libxcb-cursor0

      - name: Configure with sanitizers
        run: >
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DGAMESHUB_SANITIZE=ON

      # Only the test binary: the app itself is not what this leg runs.
      - name: Build the sanitized test binary
        run: cmake --build build-asan --target gameshub_uitest

      # detect_leaks=0 deliberately. This app frees neither its sound effects
      # nor a game once opened — GHUB-0058 and GHUB-0057 are those bullets,
      # and GHUB-0058 says in as many words that they would drown out the leak
      # checking this fuzz needs. Turn it on when those are closed, not before.
      # The settings are inline rather than in an `env:` block so that
      # scripts/local-ci.sh runs this step exactly as CI does: it executes the
      # workflow's own `run:` bodies and applies nothing around them.
      - name: Fuzz the saved-game parsers
        run: |
          QT_QPA_PLATFORM=offscreen \
          ASAN_OPTIONS=detect_leaks=0 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          ./build-asan/gameshub_uitest --fuzz 4000

  # GHUB-0170 worked the clang-tidy backlog to zero and turned WarningsAsErrors
  # on. Nothing ran it, so the only thing keeping it at zero was somebody
  # remembering to — which is how the backlog got to 69 in the first place.
  #
  # Its own job rather than a step on the matrix, for the reason the sanitizer
  # leg is: it is Linux only, and it analyses rather than builds.
  #
  # The version is PINNED. Unpinned, a runner-image bump brings checks nobody
  # has triaged and reddens a build that changed nothing — and with
  # WarningsAsErrors set, that is a hard failure rather than a note. It is also
  # deliberately OLDER than the clang-tidy a developer is likely to have
  # locally: check families only grow, so a newer local run is the stricter of
  # the two and this leg should not be the first to see a finding.
  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgl1-mesa-dev \
            libxkbcommon-x11-0 libxcb-cursor0

      # Put the pinned binary FIRST on the path rather than calling it by its
      # versioned name below. scripts/local-ci.sh executes this workflow's own
      # run: bodies, and `clang-tidy-18` is not a name any developer machine
      # has -- so the analyse step would fail locally for a reason that has
      # nothing to do with the code. /usr/local/bin precedes /usr/bin.
      - name: Install clang-tidy
        run: |
          sudo apt-get install -y -qq clang-tidy-18
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy
          clang-tidy --version

      # Configure only. clang-tidy needs the compile database and the headers
      # configure_file generates (funding.h); nothing here includes a .moc, so
      # AUTOMOC's build-time output is not required and the build is not worth
      # its minutes. GAMESHUB_FAST_BUILD=OFF because ccache and mold have
      # nothing to offer a job that compiles nothing.
      - name: Configure for the compile database
        run: >
          cmake -S . -B build-tidy -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DGAMESHUB_FAST_BUILD=OFF

      # xargs rather than run-clang-tidy, which lives in a separate package on
      # this image. xargs exits 123 when any invocation fails, so a finding
      # still fails the step — .clang-tidy carries WarningsAsErrors, so a
      # finding is an error rather than a warning.
      - name: Analyse every source
        run: |
          git ls-files 'src/*.cpp' \
            | xargs -P 4 -n 4 clang-tidy -p build-tidy --quiet
