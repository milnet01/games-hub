# Push-gate settings for ~/.claude/githooks/pre-push, which .githooks/pre-push
# hands every push to. Committed so a fresh clone pushes the way this one
# does; a key in a clone's own .git/config wins over this file.
#
# The gate itself is scripts/local-ci.sh, which the hook finds without being
# told.
[ants "gate"]
	# What counts as documentation: EVERY pushed path must match one of these
	# for the push to run the docs mode alone. The same set as ci.yml's
	# paths-ignore, so CI skips exactly what the hook treats as docs; change
	# the two together. No test reads a file on it.
	docsGlob = *.md|docs/*|LICENSE|.gitignore|packaging/licenses/*
	# local-ci.sh's docs mode: the workflow linters.
	docsMode = --lint
	# Gate in the real checkout when the pushed tip is HEAD and nothing is
	# modified or untracked, so the warm build/ tree is reused. Anything else
	# gets a fresh checkout of the pushed commit, which builds from cold.
	inPlace = true
